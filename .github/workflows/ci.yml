name: ci
on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags for git describe versions
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make vet
      - run: make lint
      - run: make vuln
      - run: make test
      - name: Fuzz (short)
        run: make fuzz FUZZTIME=20s
      - name: Namespace lab (routed topology, trace, TCP fallback, epochs)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo modprobe sch_netem || true # WAN variant of the acceptance estate
          sudo apt-get install -y --no-install-recommends tcpdump
          make lab
      - name: Release builds (every shipped platform)
        run: make release-all

  windows:
    strategy:
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # Hosted runners are elevated; standard-user coverage still needs a
      # separate non-admin runner.
      - run: go test -race ./...
      - run: go build -o lanscan.exe ./cmd/lanscan
      - run: ./lanscan.exe --format text --require-capability routes --require-capability neighbors
